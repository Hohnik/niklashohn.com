<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niklas Hohn</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="rainCanvas"></canvas>
    <div id="graveyard"></div>
    <div id="fog"></div>

    <nav class="navbar">
      <button id="trigger" class="button">Don't press here!!!</button>
    </nav>

    <h3 id="timer">00:00:00</h3>
    <div id="text" class="hero-text">Hi, my name is Niklas</div>

    <div id="nameDuckWrap">
      <button id="nameDuck" class="button">Name your duck</button>
      <form id="nameForm" class="name-form" hidden>
        <input
          id="nameInput"
          class="name-input"
          type="text"
          maxlength="18"
          placeholder="Your duck's name…"
          autocomplete="off"
        />
        <button type="submit" class="button">Name it</button>
      </form>
    </div>

    <div id="pet" class="pixel-pet"></div>

    <script src="scripts/graveyard.js"></script>
    <script src="scripts/pixelfont.js"></script>
    <script src="scripts/rain.js"></script>
    <script src="scripts/raven.js"></script>
    <script src="scripts/timer.js"></script>
  </body>
</html>
